name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Show available paper-api 26.2 versions
        run: curl -sS https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -oE '<version>26\.2[^<]*' | tail -10 || true
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BowRounds
          path: build/libs/*.jar
