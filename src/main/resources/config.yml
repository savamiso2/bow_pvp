# BowRounds 設定

match:
  rounds: 8              # 1マッチのラウンド数（合計ポイントで優勝を決める）
  min-players: 2
  countdown-seconds: 3
  round-time-seconds: 90 # 経過で全員発光
  border-shrink-after-seconds: 45
  border-shrink-duration-seconds: 40
  border-min-size: 8
  card-pick-seconds: 0 # 0 = 制限時間なし（全員が選ぶまで待つ）

points:
  kill: 1
  # 順位ごとのポイント（1位, 2位, 3位, ...）。リストより下の順位は 0
  placement: [5, 3, 2, 1, 1]

player:
  max-health: 10.0       # ハート5個
  magazine: 3            # 装填数
  reload-ticks: 40
  # ダメージはすべて固定値（チャージ量や爆風の距離では変わらない）。カードの倍率だけが掛かる
  base-damage: 4.0       # 矢1本のダメージ
  explosion-damage: 3.0  # 爆裂矢の爆風ダメージ（範囲内なら一律）
  arrow-speed: 1.0       # 矢の速度倍率
  # 矢の当たり判定の余裕（ブロック）。昔のマイクラと同じく撃った直後から一定。0.3 = 昔のバニラ、0 = 余裕なし
  arrow-hit-margin: 0.3
  guard-duration-ticks: 6   # 左クリックのガードが有効な時間（0.3秒）
  guard-cooldown-ticks: 80  # ガードのクールダウン（4秒）

cards:
  # stage = 目の前に3Dのカードが浮かび、見て・クリックで選ぶ / menu = チェスト型の画面で選ぶ
  style: stage
  # 何枚から選ぶか。下位プレイヤーは +1 枚
  offer-size: 5
  bottom-bonus-ratio: 0.25 # 下位この割合はレアカードが出やすい
  # 重ね取りの上限（大人数での負荷対策）
  max-extra-arrows: 6
  max-bounces: 3

# カードの絵柄（リソースパック）。参加時に配り、読み込めた人にだけカードの見た目が変わる
resource-pack:
  enabled: true
  url: https://github.com/savamiso2/bow_pvp/releases/latest/download/BowRounds-pack.zip
  required: false # true にすると、断った人はサーバーに入れない
